name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-duplicate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_skip: ${{ steps.check.outcome == 'success' && steps.check.outputs.should_skip == 'true' }}
    steps:
    - name: Check for a successful duplicate
      id: check
      uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
      # An API failure must fall back to running CI.
      continue-on-error: true
      with:
        # Only reuse completed successes; a running build could still fail or be cancelled.
        concurrent_skipping: 'never'
        skip_after_successful_duplicate: 'true'
        cancel_others: 'false'
        do_not_skip: '["workflow_dispatch","schedule","merge_group","release"]'

  test:
    needs: skip-duplicate
    if: needs.skip-duplicate.outputs.should_skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Configure CMake (Debug + coverage)
        run: |
          cmake -B build -S tests \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSERIALSTORM_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Collect coverage data
        run: |
          lcov --rc geninfo_unexecuted_blocks=1 \
               --capture \
               --directory build \
               --output-file coverage.info
          # Strip system headers and third-party Catch2 sources
          lcov --remove coverage.info \
               '/usr/*' \
               '*/build/_deps/*' \
               --output-file coverage.info
          lcov --list coverage.info

      - name: Generate HTML report
        run: genhtml coverage.info --output-directory coverage-report

      - name: Upload HTML coverage report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
